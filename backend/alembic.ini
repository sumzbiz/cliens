# Alembic configuration.
#
# Run from the `backend/` directory (which is what `node scripts/py.mjs` does):
#   npm run db:migrate                      apply all migrations
#   node scripts/py.mjs -m alembic revision --autogenerate -m "message"
#
# The database URL is NOT set here. env.py reads it from the application settings
# so there is exactly one place a connection string is configured, and so no
# credential is ever written into a tracked file.

[alembic]
# %(here)s resolves to this file's directory. Mako refuses a template path that
# escapes its root via "..", so the location must be absolute rather than relative.
script_location = %(here)s/../db/migrations
prepend_sys_path = .
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so `ls` orders them the
# same way Alembic does.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
