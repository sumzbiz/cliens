[project]
name = "building-quality-score-backend"
version = "0.1.0"
description = "Building Quality Score — IS 456 material compliance against measured climate."
requires-python = ">=3.11"

dependencies = [
    # --- Web framework -----------------------------------------------------
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",

    # --- Database ----------------------------------------------------------
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",           # async driver used by the application
    "psycopg[binary]==3.2.3",    # sync driver used by Alembic migrations
    "geoalchemy2==0.16.0",       # PostGIS column types for SQLAlchemy
    "alembic==1.14.0",

    # --- Geometry ----------------------------------------------------------
    # shapely validates untrusted polygon geometry before it reaches PostGIS.
    "shapely==2.0.6",

    # --- External clients --------------------------------------------------
    "httpx==0.28.1",
    "tenacity==9.0.0",           # retry policy for external calls
    # Composites the satellite tile and its place-name overlay into one image,
    # because the globe renderer can only paint a single tile layer.
    "pillow==12.3.0",

    # --- Observability -----------------------------------------------------
    "structlog==24.4.0",

    # --- ML inference ------------------------------------------------------
    # Pinned exactly: unpickling a model artifact built by a different
    # scikit-learn version is unsupported and can silently change predictions.
    "scikit-learn==1.6.0",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "joblib==1.4.2",
    # PDF generation for the downloadable client report.
    "reportlab==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "respx==0.22.0",             # httpx request mocking, so tests never hit the network
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.14.0",
    "pandas-stubs==2.2.3.241126",
    "types-shapely==2.0.0.20241221",
    "pre-commit==4.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# These data files must ship with the package, not merely exist in the source
# tree, or an installed deployment loses its offline path and its seed data.
"app.repositories" = ["data/*.json"]

# ---------------------------------------------------------------------------
# ruff — linting and import sorting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # flake8-annotations — enforces the "type hints everywhere" rule
    "ASYNC",    # flake8-async
    "S",        # bandit security checks
    "T20",      # flake8-print — enforces "structured logging, never print"
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101).
"app/tests/*" = ["S101"]
# Migration bodies are generated by `alembic revision --autogenerate`. Their long
# single-statement lines are reformatted by black but not rewrapped, and the
# revision identifiers are module-level names ruff reads as unsorted imports.
"../db/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

# ---------------------------------------------------------------------------
# black — formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false   # Any is permitted only where a third-party lib forces it
plugins = ["pydantic.mypy"]
# Alembic's `op` and `context` are runtime-assembled proxy objects with no static
# types, so type checking generated migration bodies yields only false positives.
# Migrations are still linted by ruff and formatted by black.
exclude = ["/db/migrations/"]

[[tool.mypy.overrides]]
# These distributions ship no type information. Ignoring the missing stubs is
# scoped to the import itself; our own wrappers around them remain fully typed.
module = ["geoalchemy2.*", "sklearn.*", "joblib.*", "reportlab.*", "eccodes.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: exercises a real PostGIS test database (requires docker compose up)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
# SQLAlchemy's asyncio support resumes coroutines inside a greenlet. Without
# declaring that here, coverage loses its trace function across the switch and
# reports every line after an awaited database call as unexecuted — which would
# hide genuinely untested code behind a false negative.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# CI fails below this line; see .github/workflows/ci.yml.
fail_under = 80
show_missing = true
