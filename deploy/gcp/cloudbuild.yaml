# Builds and pushes both images. Run by deploy/gcp/deploy.sh:
#
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_REPOSITORY=cliens,_TAG=<git sha> ...
#
# The two builds are independent and run in parallel.

steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${_TAG}
      - .

  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file=deploy/gcp/web/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_TAG}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: cliens
  _TAG: latest

options:
  # A user-specified build service account requires an explicit logging mode.
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
